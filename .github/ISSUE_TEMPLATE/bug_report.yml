name: 网站功能问题
description: 记录页面、导航、下载或学习进度问题
title: "[问题] "
body:
  - type: input
    id: page
    attributes:
      label: 页面或教程地址
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 操作步骤、实际结果和预期结果
      description: 请说明如何复现，不要提供密码、密钥或私人对话。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 浏览器、系统与屏幕宽度
  - type: textarea
    id: evidence
    attributes:
      label: 截图或补充记录
      description: 上传前去掉账号与个人信息。
