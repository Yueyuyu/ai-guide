name: 实际试用反馈
description: 告诉我们网络准备、豆包或 Codex 教程中的真实卡点
title: "[试用反馈] "
body:
  - type: markdown
    attributes:
      value: "感谢参加试用。没有做过的步骤请写未尝试；请勿公开个人订阅、密码、密钥、验证码或私人对话。维护者与自动化测试不计入真人试用。"
  - type: dropdown
    id: track
    attributes:
      label: 试用主线
      options: [网络准备, 豆包第一份清单, Codex 第一个网页]
    validations:
      required: true
  - type: dropdown
    id: experience
    attributes:
      label: 开始前的基础
      options: [第一次使用这类工具, 用过 AI 对话但没做过这项任务, 已做过类似任务, 维护者或自动化测试]
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际操作与卡点
      description: 写下日期、系统、软件版本、进行到哪一步、实际看到什么，以及最希望修改的一处。
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: 实际结果
      options: [未完成, 独立完成并打开成果, 借助他人帮助完成, 仅阅读未实操]
    validations:
      required: true
  - type: input
    id: duration
    attributes:
      label: 大约用时（选填）
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认
      options:
        - label: 我已移除私人信息，知道提交后所有人都能看到
          required: true
